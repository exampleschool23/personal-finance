name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Every test, plus a coverage floor and the list of files no test runs yet (scripts/coverage-floor.json).
      - run: npm run test:coverage
      - run: npm run lint
      - run: npm run build:production
      - run: npm run typecheck
      - run: npm run test:integration
