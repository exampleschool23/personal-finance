name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Every test, plus a coverage floor and the list of files no test runs yet (scripts/coverage-floor.json).
      - run: npm run test:coverage
      - run: npm run lint
      - run: npm run build:production
      - run: npm run typecheck
      - run: npm run test:integration
  # The P0 flows in a real browser: a production build against e2e/fake-supabase.mjs (the app's schema in PGlite),
  # on the fixed workspace in e2e/fixture.mjs. No real account or service is reached.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:production
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
